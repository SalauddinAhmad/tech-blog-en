name: Deploy Hugo Blog (English)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.148.0'
          extended: true
      - name: Build
        run: hugo --minify --cleanDestinationDir
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: ''
      - name: Verify deployment (CDN settle retry)
        run: |
          code=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://salauddinahmad.github.io/tech-blog-en/ || true)
            [ "$code" = "200" ] && break
            echo "retry $i: $code"; sleep 10
          done
          [ "$code" = "200" ] || exit 1
