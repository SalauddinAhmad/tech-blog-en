name: Auto Publish Daily Posts

on:
  # schedule:
    # - cron: '30 10 * * *'  # Daily at 10:30 AM BDT (04:30 UTC)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate daily posts from live news
        run: python scripts/auto-publish-github.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ static/images/
          if ! git diff --cached --quiet; then
            git commit -m "📝 Auto-post: $(date +%Y-%m-%d)"
            git push
          else
            echo "No new posts to publish."
          fi
