{{- /* Compact footer — extend hook: per-post view badge + SW registration only. */ -}}
<script>
(function(){
  'use strict';
  var loading = {{- (T "view_loading") | jsonify -}};
  var suffix  = {{- (T "view_count_suffix") | jsonify -}};
  var content = document.querySelector('.post-content, .post-body, article .entry-content, .post');
  var pagePv  = document.getElementById('busuanzi_value_page_pv');
  if (content && pagePv && document.querySelector('.post-title, .entry-header')) {
    var badge = document.createElement('div');
    badge.className = 'view-badge';
    badge.innerHTML = '<span>👁️</span> <span class="v-count">' + loading + '</span>';
    var target = document.querySelector('.post-content, .entry-content, .post-body');
    if (target) { target.parentNode.insertBefore(badge, target); }
  }
  var t = setInterval(function () {
    var pv = document.getElementById('busuanzi_value_page_pv');
    var badgeCount = document.querySelector('.view-badge .v-count');
    if (pv && badgeCount && pv.textContent.trim() !== '' && badgeCount.textContent.indexOf(loading) !== -1) {
      badgeCount.textContent = pv.textContent.trim() + suffix;
      clearInterval(t);
    }
  }, 1000);
  setTimeout(function () { clearInterval(t); }, 15000);
})();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('{{ "sw.js" | relURL }}').catch(function(){}); }
</script>
