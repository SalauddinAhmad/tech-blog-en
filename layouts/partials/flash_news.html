{{- if .IsHome }}{{- with index .Site.Data "live-news" }}{{- with .news }}
<section class="flash-news-section">
  <h2 class="flash-news-title">{{ T "flash_title" }}</h2>
  <div class="flash-grid">
    {{ range first 3 (sort . "importance" "desc") }}
    <article class="flash-card">
      <div class="flash-card-header">
        <span class="flash-topic">{{ .topicIcon }} {{ .topic }}</span>
        <span class="flash-source">{{ .source }}</span>
      </div>
      <h3 class="flash-title"><a href="{{ .link }}" target="_blank" rel="noopener">{{ .title }}</a></h3>
    </article>
    {{ end }}
  </div>
</section>
{{- end }}{{- end }}{{- end }}
