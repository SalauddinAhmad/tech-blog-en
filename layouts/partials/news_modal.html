<div class="news-modal-overlay" id="newsModal" style="display:none">
  <div class="news-modal">
    <button class="modal-close" onclick="closeNewsModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>
<script>
function openNewsModal(el){
  var d=el.dataset,m=document.getElementById("modalContent"),o=document.getElementById("newsModal");
  m.innerHTML="<div class=\"modal-topic\">"+d.topic+"</div><h2 class=\"modal-title\">"+d.title+"</h2><p class=\"modal-summary\">"+d.summary+"</p><div class=\"modal-source\">Source: "+d.source+"</div><a class=\"modal-link\" href=\""+d.link+"\" target=\"_blank\" rel=\"noopener\">Read Full Article →</a>";
  o.style.display="flex";
}
function closeNewsModal(){document.getElementById("newsModal").style.display="none"}
document.addEventListener("DOMContentLoaded",function(){
  var o=document.getElementById("newsModal");
  if(o)o.addEventListener("click",function(e){if(e.target===o)closeNewsModal()});
});
</script>
