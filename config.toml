# ═══════════════════════════════════════════════════════════════
# 🇬🇧 Tech Intelligence English — English Blog (all in English)
# Hugo + PaperMod + SEO — https://salauddinahmad.github.io/tech-blog-en/
# ═══════════════════════════════════════════════════════════════

baseURL = "https://salauddinahmad.github.io/tech-blog-en/"
title = "Tech Intelligence English"
theme = "hugo-papermod"
[pagination]
pagerSize = 10
languageCode = "en"

# ── SEO ──
enableRobotsTXT = true
canonifyURLs = true
enableEmoji = true
summaryLength = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.8
  filename = "sitemap.xml"

[params]
  mainSections = ["posts"]
  env = "production"
  description = "Daily Tech Intelligence & Adaptability reports — in English, auto-published with cover images."
  author = "Salauddin Ahmad"
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  ShowLastModified = true
  UseHugoToc = true
  hideAuthor = true
  dateFormat = "2 Jan 2006"
  hideFooter = false

  [params.homeInfoParams]
    Title = "Latest News"
    Content = "Daily technology analysis and adaptability guides — fully in English"

  [params.profileMode]
    enabled = false
    title = "Salauddin Ahmad"
    subtitle = "Fullstack Developer & Tech Analyst"
    imageUrl = "/images/profile.jpg"

  [params.social]
    github = "https://github.com/SalauddinAhmad"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Tech Intelligence"
    url = "/categories/tech-intelligence/"
    weight = 2
  [[menu.main]]
    name = "Adaptability"
    url = "/categories/adaptability/"
    weight = 3
  [[menu.main]]
    name = "বাংলা ব্লগ"
    url = "https://salauddinahmad.github.io/tech-blog/"
    weight = 4

[taxonomies]
  category = "categories"
  tag = "tags"
